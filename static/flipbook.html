<!DOCTYPE html>
<html lang="en" data-i18n-title="flipbook.title">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Flipbook</title>
    <script src="/static/i18n.js"></script>
    <link rel="stylesheet" href="/static/flipbook.css">
    <style>
        /* ── Session metrics panel ─────────────────────────────────────── */
        #metricsPanel {
            max-width: 560px;
            margin: 2.5rem auto 3rem;
            padding: 1.5rem 1.75rem;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 10px;
            font-family: system-ui, sans-serif;
            color: #e0e0e0;
        }
        #metricsPanel h2 {
            margin: 0 0 1.1rem;
            font-size: 0.95rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: #aaa;
        }
        .metrics-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.88rem;
            margin-bottom: 1rem;
        }
        .metrics-table th,
        .metrics-table td {
            padding: 0.45rem 0.7rem;
            text-align: center;
            border: 1px solid #2e2e2e;
        }
        .metrics-table thead th {
            background: #242424;
            color: #bbb;
            font-weight: 600;
            font-size: 0.80rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .metrics-table tbody th {
            text-align: left;
            color: #ccc;
            font-weight: 500;
            background: #1e1e1e;
            white-space: nowrap;
        }
        .metrics-table tbody td {
            color: #f0f0f0;
            font-variant-numeric: tabular-nums;
        }
        .metrics-table tbody td.na {
            color: #555;
        }
        .spearman-row {
            margin: 0.6rem 0 0;
            font-size: 0.88rem;
            color: #ccc;
        }
        .spearman-row strong {
            color: #f0f0f0;
            font-variant-numeric: tabular-nums;
        }
        .spearman-p {
            font-size: 0.78rem;
            color: #666;
            margin-left: 0.4rem;
        }
        .metrics-note {
            margin: 0.75rem 0 0;
            font-size: 0.76rem;
            color: #555;
            line-height: 1.5;
        }
        .metrics-loading {
            color: #555;
            font-size: 0.85rem;
            text-align: center;
            padding: 0.5rem 0;
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <a href="/" class="back-link" data-i18n="flipbook.backLink">← Back to search</a>
    </div>

    <div id="flipbookView" class="flipbook-view hidden">
        <div class="nav-controls">
            <button id="prevPage" class="nav-btn" data-i18n="flipbook.prevBtn">← Previous</button>
            <div class="page-info">
                <span id="pageInfo"></span>
            </div>
            <button id="nextPage" class="nav-btn" data-i18n="flipbook.nextBtn">Next →</button>
        </div>

        <div class="flipbook-stage">
            <div class="book-container">
                <div class="book" id="flipbook"></div>
            </div>
        </div>
    </div>

    <div id="errorMsg" class="hidden error-msg">
        <p>
            <span data-i18n="flipbook.noImages">No images found.</span>
            <a href="/" data-i18n="flipbook.goBack">Go back to search and select images.</a>
        </p>
    </div>

    <!-- Session metrics panel (shown only when session_id is in URL) -->
    <div id="metricsPanel" class="hidden">
        <h2>Session metrics</h2>
        <p class="metrics-loading" id="metricsLoading">Loading…</p>

        <table class="metrics-table hidden" id="metricsTable">
            <thead>
                <tr>
                    <th></th>
                    <th>Gender</th>
                    <th>Age</th>
                    <th>Skin tone</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <th>FAIR</th>
                    <td id="fair-gender" class="na">–</td>
                    <td id="fair-age"    class="na">–</td>
                    <td id="fair-skin"   class="na">–</td>
                </tr>
            </tbody>
        </table>

        <p class="spearman-row">
            Spearman <em>r</em> (model rank vs. your rank):
            <strong id="spearman-val">–</strong>
            <span class="spearman-p" id="spearman-p"></span>
        </p>
        <p class="metrics-note" id="metricsNote"></p>
    </div>

    <script src="/static/flipbook.js"></script>
    <script>
        // Load and render session metrics if session_id is present in URL
        (function () {
            const params    = new URLSearchParams(window.location.search);
            const sessionId = params.get('session_id');
            if (!sessionId) return;

            const panel = document.getElementById('metricsPanel');
            panel.classList.remove('hidden');

            fetch(`/api/session/${sessionId}/metrics`)
                .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
                .then(m => {
                    document.getElementById('metricsLoading').classList.add('hidden');

                    // ── FAIR / NDKL table ─────────────────────────────────
                    const hasFair = 'FAIR_gender' in m;
                    if (hasFair) {
                        const fmt = v => (v === undefined || v === null) ? '–' : v.toFixed(3);
                        const set = (id, v) => {
                            const el = document.getElementById(id);
                            el.textContent = fmt(v);
                            if (v !== undefined && v !== null) el.classList.remove('na');
                        };
                        set('fair-gender', m.FAIR_gender);
                        set('fair-age',    m.FAIR_age);
                        set('fair-skin',   m.FAIR_skin_tone);
                        document.getElementById('metricsTable').classList.remove('hidden');
                    }

                    // ── Spearman ──────────────────────────────────────────
                    if ('spearman_r' in m) {
                        document.getElementById('spearman-val').textContent =
                            m.spearman_r.toFixed(3);
                        if (m.spearman_p !== null && m.spearman_p !== undefined) {
                            document.getElementById('spearman-p').textContent =
                                `(p = ${m.spearman_p.toFixed(3)})`;
                        }
                    }

                    // ── Note ──────────────────────────────────────────────
                    const parts = ['Based on your 9 selected images.'];
                    if (!hasFair) {
                        parts.push('FAIR not available — annotations not loaded on this server.');
                    }
                    document.getElementById('metricsNote').textContent = parts.join(' ');
                })
                .catch(() => {
                    document.getElementById('metricsLoading').textContent =
                        'Metrics not available for this session.';
                });
        })();
    </script>
</body>
</html>
